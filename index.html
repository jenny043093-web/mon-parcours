:width .2s}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px;gap:12px}.section-title h3{font-size:19px;margin:0}.schedule{display:grid;gap:10px}.slot{display:grid;grid-template-columns:70px 125px 1fr auto;gap:12px;align-items:center;padding:12px 15px;border:1px solid var(--line);border-radius:13px;background:white}.slot .day{font-weight:750}.tag{font-size:12px;padding:3px 9px;border-radius:8px;background:#ebf4f2;color:var(--teal)}.tag.jp{background:#fff3e5;color:#9b5c13}.btn{background:var(--teal);border:1px solid var(--teal);color:white;border-radius:11px;padding:10px 15px;font-weight:700}.btn.secondary{background:white;color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.week-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 19px}.week-tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;color:var(--ink)}.week-tabs button.active{background:var(--deep);border-color:var(--deep);color:white}.lesson-list{display:grid;grid-template-columns:1fr 1fr;gap:15px}.lesson{padding:18px;border-radius:15px;background:white;border:1px solid var(--line)}.lesson h4{margin:4px 0 6px;font-size:18px}.task{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid #eef2f0}.task:last-child{border:0}.task input{accent-color:var(--teal);width:18px;height:18px;margin-top:3px}.task.checked span{text-decoration:line-through;color:var(--muted)}.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.resource{border:1px solid var(--line);border-radius:12px;padding:14px;margin:9px 0;background:white}.resource strong{display:block}textarea,.field{border:1px solid #cbd9d5;background:white;width:100%;border-radius:12px;padding:12px;color:var(--ink);outline-color:var(--teal)}textarea{resize:vertical;min-height:175px}.field{max-width:320px}.question{font-size:20px;font-weight:700;line-height:1.65}.option{display:block;width:100%;text-align:left;background:#f8faf9;border:1px solid var(--line);padding:13px;margin:8px 0;border-radius:11px;color:var(--ink)}.option:hover{border-color:var(--teal)}.option.selected{border-color:var(--teal);background:var(--soft)}.correct{color:#087a72}.incorrect{color:#aa4c30}.notice{background:#e9f4f1;padding:14px 16px;border-radius:13px;border:1px solid #cde5dd}.hidden{display:none!important}.footnote{color:var(--muted);font-size:12px;margin-top:18px}.quicklinks{display:flex;gap:8px;flex-wrap:wrap}.quicklinks a{text-decoration:none;border:1px solid #cfdfda;padding:8px 12px;border-radius:10px;background:white}.empty{color:var(--muted);padding:16px}.mobile-nav{display:none}.week-range{font-size:13px;color:var(--muted)}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);font-weight:800}.reading{max-width:840px}.divider{border:0;border-top:1px solid var(--line);margin:21px 0}@media(max-width:900px){.layout{display:block}aside{padding:13px 18px;gap:0}.brand{padding:0}.nav,.side-foot{display:none}.mobile-nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px}.mobile-nav button{white-space:nowrap;background:#21434d;color:white;border:0;border-radius:10px;padding:7px 11px}.mobile-nav button.active{background:#e6f1ed;color:var(--deep)}main{padding:24px 15px}.grid{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}@media(max-width:570px){.grid,.lesson-list{grid-template-columns:1fr}.slot{grid-template-columns:48px 1fr auto;gap:7px}.slot .time{grid-column:2;font-size:13px;color:var(--muted)}.slot .tag{grid-column:3;grid-row:1/3}.slot .description{grid-column:2}.card{padding:16px}header{align-items:flex-start;flex-direction:column}.stat{font-size:30px}}
</style></head><body><div class="layout"><aside><div class="brand"><div style="font-size:24px;margin-bottom:5px">◈</div><h1>Mon Parcours</h1><small>法日雙語・自學工作室</small></div><nav class="nav" id="nav"></nav><nav class="mobile-nav" id="mobile-nav"></nav><div class="side-foot">第一階段 · 2026/11/02—12/13<br>所有進度保存在此瀏覽器，可匯出備份。</div></aside><main><header><div><div class="kicker">PERSONAL LANGUAGE STUDIO</div><h2 id="page-title">學習總覽</h2><p id="page-subtitle">法文主修 · 日文維持 · 6 週學習計畫</p></div><span class="pill">第一階段 · 6 週</span></header><div id="content"></div></main></div><script>
'use strict';
const SITE_KEY='mon-parcours-2026-v1';
const start='2026-11-02';
const weeks=[
{range:'11/02–11/08',dates:['2026-11-02','2026-11-03','2026-11-05','2026-11-06','2026-11-08'],fr:[['1','Bienvenue !','問候、自我介紹'],['2','Qui est-ce ?','國籍、職業及人物介紹']],jp:'第 1–4 課：です句、指示、場所、時間',focus:'問候、自我介紹、國籍與職業'},
{range:'11/09–11/15',dates:['2026-11-09','2026-11-10','2026-11-12','2026-11-13','2026-11-15'],fr:[['3','Ça va bien ?','近況與個人資訊'],['4','Correspondants','興趣、住處及介紹']],jp:'第 5–8 課：移動、動詞、助詞、形容詞',focus:'近況、個人資訊、興趣；U1 總整'},
{range:'11/16–11/22',dates:['2026-11-16','2026-11-17','2026-11-19','2026-11-20','2026-11-22'],fr:[['5','Trouvez l’objet','物品與空間位置'],['6','Portrait-robot','外貌、衣著與描述']],jp:'第 9–12 課：喜好、存在句、數量、比較',focus:'物品、位置、外貌、衣著'},
{range:'11/23–11/29',dates:['2026-11-23','2026-11-24','2026-11-26','2026-11-27','2026-11-29'],fr:[['7','Shopping','購物與價格'],['8','Le coin des artistes','人物與藝術描述']],jp:'第 13–15 課：願望、て形與相關句型',focus:'購物、價格、描述人物；U2 總整'},
{range:'11/30–12/06',dates:['2026-11-30','2026-12-01','2026-12-03','2026-12-04','2026-12-06'],fr:[['9','Appartement à louer','住處與房間方位'],['10','C’est par où ?','問路與交通']],jp:'第 16–17 課：連接動作、ない形',focus:'住處、位置、問路與交通'},
{range:'12/07–12/13',dates:['2026-12-07','2026-12-08','2026-12-10','2026-12-11','2026-12-13'],fr:[['11','Bon voyage !','旅遊與住宿'],['12','Marseille','城市與旅遊資訊']],jp:'第 18–19 課：辭書形、た形、經驗；總複習',focus:'旅遊、住宿、城市；U1–3 第一階段總驗收'}
];
const slots=[['週一','09:30–11:30','法文 Leçon A 新課','法文'],['週二','09:30–11:30','法文 Leçon B 新課','法文'],['週四','10:00–11:30','法文兩課聽說、練習冊與單字','法文'],['週五','09:30–10:00','日文單字、助詞與動詞變化','日文'],['週日','14:00–15:30','法文家教式驗收','法文'],['週日','16:00–17:30','日文綜合複習','日文']];
const frTasks=['觀看對應影片並理解內容','理解課文與核心文法','整理重要單字和例句','完成課文聽力與跟讀','用本課句型造句'];
const frReview=['完成兩課課文聽力','完成口說與跟讀','完成練習冊對應習題','整理單字與錯題'];
const frSunday=['法文暖身與回顧','額外聽力理解','口說或文字互動','文法與單字測驗','訂正並記錄成績'];
const jpFriday=['單字主動回想（15 分鐘）','助詞／動詞變化（15 分鐘）'];
const jpSunday=['單字快速複習','聽力與跟讀','文法與口說','閱讀與造句','訂正與記錄'];
const quizzes=[
{lang:'fr',q:'第一次見面時，哪一句適合表達「你好」？',opts:['Bonjour !','Bonne nuit !','À demain !'],a:0,why:'Bonjour 是日常問候語。'},
{lang:'fr',q:'「Je ___ étudiant.」應填入哪個 être 形式？',opts:['es','suis','est'],a:1,why:'Je suis = 我是。'},
{lang:'fr',q:'「Comment tu t’appelles ?」主要在問什麼？',opts:['你叫什麼名字？','你住在哪裡？','你幾歲？'],a:0,why:'s’appeler 用於詢問及介紹名字。'},
{lang:'fr',q:'「Qui est-ce ?」通常是什麼意思？',opts:['這是哪裡？','這是誰？','現在幾點？'],a:1,why:'Qui 詢問人物。'},
{lang:'fr',q:'「C’est combien ?」適合用於哪個情境？',opts:['詢問價格','問候近況','介紹國籍'],a:0,why:'C’est combien ? = 多少錢？'},
{lang:'fr',q:'「Où est la gare ?」是在詢問什麼？',opts:['火車站在哪裡？','車票多少錢？','你從哪裡來？'],a:0,why:'Où est... ? 用於詢問位置。'},
{lang:'jp',q:'「行ったことがあります」主要用來表達什麼？',opts:['過去經驗','未來計畫','正在進行'],a:0,why:'た形＋ことがあります表示曾經做過的經驗。'},
{lang:'jp',q:'「食べたり、飲んだりします」中的 ～たり～たり 用來做什麼？',opts:['列舉代表性的動作','表示禁止','表示必須'],a:0,why:'列舉數個動作，不代表所有活動。'},
{lang:'jp',q:'「日本語を勉強します。」的「を」主要標示什麼？',opts:['動作對象','動作場所','移動方向'],a:0,why:'「を」常標示他動詞的受詞。'},
{lang:'jp',q:'「東京へ行きます。」表示什麼？',opts:['去東京','在東京吃飯','來自東京'],a:0,why:'へ 表示移動方向。'},
{lang:'jp',q:'「書きます」的 て形是哪一個？',opts:['書いた','書いて','書かない'],a:1,why:'書く → 書いて。'},
{lang:'jp',q:'「静かです」中的「静か」屬於哪一類？',opts:['い形容詞','な形容詞','動詞'],a:1,why:'静かな部屋，屬於な形容詞。'}
];
const navItems=[['dashboard','▦','學習總覽'],['curriculum','▤','六週課程'],['planner','◷','固定課表'],['practice','✎','測驗練習'],['notes','▣','學習筆記'],['resources','↗','資源與設定']];
const defaults={done:{},notes:{},scores:[],chosenWeek:0};let state=load();let page='dashboard',quizSession=null;
function load(){try{let obj=JSON.parse(localStorage.getItem(SITE_KEY));return {...defaults,...obj,done:obj?.done||{},notes:obj?.notes||{},scores:obj?.scores||[]}}catch{return structuredClone(defaults)}}
function save(){try{localStorage.setItem(SITE_KEY,JSON.stringify(state))}catch{alert('瀏覽器未能儲存資料，請使用匯出備份功能。')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(w,t,n){return `${w}-${t}-${n}`}
function taskList(w,t,items){return items.map((v,i)=>{let k=key(w,t,i),d=!!state.done[k];return `<label class="task ${d?'checked':''}"><input type="checkbox" data-task="${esc(k)}" ${d?'checked':''}><span>${esc(v)}</span></label>`}).join('')}
function allTasks(w){return [...frTasks.map((_,i)=>key(w,'a',i)),...frTasks.map((_,i)=>key(w,'b',i)),...frReview.map((_,i)=>key(w,'r',i)),...frSunday.map((_,i)=>key(w,'s',i)),...jpFriday.map((_,i)=>key(w,'jf',i)),...jpSunday.map((_,i)=>key(w,'js',i))]}
function weekPct(w){let keys=allTasks(w);return Math.round(keys.filter(k=>state.done[k]).length/keys.length*100)}
function lessonDone(){let c=0;for(let w=0;w<6;w++)for(let type of ['a','b'])if(frTasks.every((_,i)=>state.done[key(w,type,i)]))c++;return c}
function progressBar(p){return `<div class="bar"><span style="width:${p}%"></span></div>`}
function panel(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}
function weekTabs(){return `<div class="week-tabs">${weeks.map((w,i)=>`<button class="${state.chosenWeek===i?'active':''}" data-week="${i}">第 ${i+1} 週</button>`).join('')}</div>`}
function renderDashboard(){let lc=lessonDone(),pct=Math.round(lc/12*100);return `<div class="grid">${panel('法文課程',`<div class="stat">${lc}<span class="muted" style="font-size:18px"> / 12 課</span></div>${progressBar(pct)}<div class="small">Unité 1–3 · 第一階段</div>`)}${panel('日文維持',`<div class="stat">第 19 課</div><div class="small">《大家的日本語 初級Ⅱ》</div><div style="margin-top:16px"><span class="pill">目前不推進新課</span></div>`)}${panel('每週學習量',`<div class="stat">9 <span style="font-size:18px">小時</span></div><div class="small">法文 7 小時＋日文 2 小時</div><div style="margin-top:16px" class="small">週三、週六休息</div>`)}</div><div class="section-title"><h3>第一階段時間線</h3><span class="small">2026/11/02–12/13</span></div><div class="grid">${weeks.map((w,i)=>`<div class="card"><div class="small">第 ${i+1} 週 · ${w.range}</div><h3 style="margin:7px 0">Leçon ${w.fr[0][0]}–${w.fr[1][0]}</h3><div class="small">${w.focus}</div>${progressBar(weekPct(i))}<div class="small">任務完成 ${weekPct(i)}%</div><button class="btn secondary" style="margin-top:12px" data-goweek="${i}">查看任務 →</button></div>`).join('')}</div><div class="section-title"><h3>固定時段</h3></div>${renderSlots()}<p class="footnote">進度將儲存於目前的瀏覽器與裝置。若清除網站資料，紀錄可能消失；請定期在「資源與設定」匯出備份。</p>`}
function renderSlots(){return `<div class="schedule">${slots.map(s=>`<div class="slot"><div class="day">${s[0]}</div><div class="time">${s[1]}</div><div class="description">${s[2]}</div><span class="tag ${s[3]==='日文'?'jp':''}">${s[3]}</span></div>`).join('')}</div>`}
function renderCurriculum(){let w=state.chosenWeek,unit=Math.floor(w/2)+1,x=weeks[w];return `${weekTabs()}<div class="notice"><strong>第 ${w+1} 週｜Unité ${unit}｜${x.range}</strong><div>${esc(x.focus)}</div><div class="small">日文：${esc(x.jp)}</div></div><div class="section-title"><h3>週一、週二｜兩課新課</h3><span class="small">各 120 分鐘</span></div><div class="lesson-list">${x.fr.map((l,i)=>`<div class="lesson"><div class="kicker">週${i?'二':'一'} · LEÇON ${l[0]}</div><h4>${esc(l[1])}</h4><div class="small">${esc(l[2])}</div><hr class="divider">${taskList(w,i?'b':'a',frTasks)}</div>`).join('')}</div><div class="section-title"><h3>複習與驗收</h3></div><div class="two-col"><div class="card"><h3>週四｜法文 90 分鐘</h3>${taskList(w,'r',frReview)}<hr class="divider"><h3>週日 14:00–15:30｜法文家教</h3>${taskList(w,'s',frSunday)}<button class="btn secondary" data-copy="french" style="margin-top:14px">複製家教啟動指令</button></div><div class="card"><h3>週五｜日文 30 分鐘</h3>${taskList(w,'jf',jpFriday)}<hr class="divider"><h3>週日 16:00–17:30｜日文 90 分鐘</h3><div class="small">${esc(x.jp)}</div>${taskList(w,'js',jpSunday)}<button class="btn secondary" data-copy="japanese" style="margin-top:14px">複製日文啟動指令</button></div></div>`}
function renderPlanner(){return `${panel('每週固定課表',renderSlots())}<div class="section-title"><h3>週日家教課流程</h3></div><div class="two-col">${panel('法文｜14:00–15:30',`<div class="small">14:00–14:10　暖身複習<br>14:10–14:30　額外聽力<br>14:30–14:55　互動口說<br>14:55–15:15　文法、單字測驗<br>15:15–15:30　訂正與診斷</div><hr class="divider"><div class="small">聽力 25 分・口說 30 分・文法 25 分・單字 20 分</div>`)}${panel('日文｜16:00–17:30',`<div class="small">16:00–16:15　單字快速複習<br>16:15–16:40　聽力與跟讀<br>16:40–17:05　文法與口說<br>17:05–17:20　閱讀與造句<br>17:20–17:30　訂正及紀錄</div><hr class="divider"><div class="small">與法文課之間保留 30 分鐘休息</div>`)}</div><p class="footnote">12 月 13 日是第一階段最後一天；期中考期間不自動安排 Unité 4 以後的課程。</p>`}
function renderPractice(){let scores=state.scores.slice(-8).reverse();return `<div class="two-col"><div class="card"><h3>即時自我測驗</h3><p class="small">第一版附有示例題庫，適合作為補充練習，不取代週日真正的家教評估，也不是教材原題。</p><div class="actions"><button class="btn" data-startquiz="fr">開始法文小測</button><button class="btn secondary" data-startquiz="jp">開始日文小測</button></div><div id="quiz-area" style="margin-top:22px"></div></div><div class="card"><h3>測驗紀錄</h3>${scores.length?scores.map(s=>`<div class="resource"><strong>${s.lang==='fr'?'法文':'日文'} · ${s.score}/${s.total} 題</strong><div class="small">${esc(s.date)} · 題庫小測，非家教評分</div></div>`).join(''):'<div class="empty">目前沒有測驗紀錄。</div>'}<hr class="divider"><h3>週日家教指令</h3><p class="small">完成本週兩課後，可在 ChatGPT 聊天中貼上家教指令，以逐題方式進行口說、聽力及文法驗收。</p><button class="btn secondary" data-copy="french">複製法文家教指令</button></div></div>`}
function renderNotes(){let w=state.chosenWeek;return `${weekTabs()}<div class="two-col"><div class="card"><h3>第 ${w+1} 週｜法文筆記</h3><textarea data-note="fr-${w}" placeholder="本週文法、例句、錯題、想問老師的問題…">${esc(state.notes['fr-'+w]||'')}</textarea><div class="small" style="margin-top:8px">輸入時自動儲存。</div></div><div class="card"><h3>第 ${w+1} 週｜日文筆記</h3><textarea data-note="jp-${w}" placeholder="需要複習的助詞、動詞變化、單字與造句…">${esc(state.notes['jp-'+w]||'')}</textarea><div class="small" style="margin-top:8px">輸入時自動儲存。</div></div></div>`}
function renderResources(){return `<div class="two-col"><div class="card"><h3>法文課程與補充</h3><div class="resource"><strong>《你好！法語 1》Unité 1–3</strong><div class="small">教材 PDF 請留在私人學習專案中，不公開部署受著作權保護的全文。</div></div><div class="resource"><strong>YouTube 教學播放清單</strong><a href="https://youtube.com/playlist?list=PLEZD5MED26kkZLvPyCzIJtvILcu7BhNCB" target="_blank" rel="noopener noreferrer">前往影片清單 ↗</a></div><div class="resource"><strong>額外法文聽力</strong><div class="quicklinks"><a target="_blank" rel="noopener noreferrer" href="https://apprendre.tv5monde.com/fr/exercices/a1-debutant">TV5MONDE A1 ↗</a><a target="_blank" rel="noopener noreferrer" href="https://francaisfacile.rfi.fr/fr/">RFI ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.languagetransfer.org/courses">Language Transfer ↗</a></div></div><div class="resource"><strong>日文複習</strong><div class="small">《大家的日本語 初級Ⅱ》已學至整套第 19 課</div><a target="_blank" rel="noopener noreferrer" href="https://www.irodori.jpf.go.jp/">Irodori 日本語 ↗</a></div></div><div class="card"><h3>個人資料管理</h3><p class="small">所有勾選、筆記和測驗結果存於此瀏覽器的 localStorage，不會自動同步手機和電腦，也沒有帳號系統。</p><div class="actions"><button class="btn" id="export-data">匯出 JSON 備份</button><button class="btn secondary" id="import-data">匯入備份</button><input id="import-file" accept="application/json,.json" type="file" class="hidden"></div><hr class="divider"><button class="btn secondary" id="reset-data">清除本站學習紀錄</button><p class="footnote">清除不可復原；建議先匯出備份。</p></div></div><div class="card" style="margin-top:18px"><h3>網站說明</h3><p>本版是可部署的個人靜態網站。進度追蹤、筆記、示例測驗、匯入及匯出皆可離線使用；外部教材和影片連結需要網路。若要跨裝置自動同步、真正語音 AI 家教或登入功能，需在後續版本加入資料庫及相關服務。</p></div>`}
const titles={dashboard:['學習總覽','兩種語言，一個清楚的學習節奏'],curriculum:['六週課程','逐課完成任務，保留真正的休息時間'],planner:['固定課表','每週 9 小時，週日雙語驗收'],practice:['測驗練習','簡短題庫與學習紀錄'],notes:['學習筆記','整理每週文法、單字和錯題'],resources:['資源與設定','教學連結、備份與資料管理']};
function render(){document.getElementById('nav').innerHTML=navItems.map(([id,ic,name])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ic}</span>${name}</button>`).join('');document.getElementById('mobile-nav').innerHTML=navItems.map(([id,ic,name])=>`<button data-page="${id}" class="${page===id?'active':''}">${name}</button>`).join('');document.getElementById('page-title').textContent=titles[page][0];document.getElementById('page-subtitle').textContent=titles[page][1];document.getElementById('content').innerHTML=({dashboard:renderDashboard,curriculum:renderCurriculum,planner:renderPlanner,practice:renderPractice,notes:renderNotes,resources:renderResources})[page]();if(page==='practice'&&quizSession)renderQuiz()}
function promptFor(lang){let w=weeks[state.chosenWeek];if(lang==='french')return `開始本週法文家教驗收。我已完成《你好！法語 1》Leçon ${w.fr[0][0]} 和 Leçon ${w.fr[1][0]}。請依照週日 14:00–15:30 的 90 分鐘流程逐題進行：暖身、真實音訊聽力（如無法播放請清楚告知）、口說互動、文法和單字測驗、訂正與評分。一次一題，等我回答後再繼續，最後給我錯題和補強建議。`;return `開始本週日文維持複習。教材《大家的日本語 初級Ⅱ》，我已學到整套第 19 課。本週複習範圍：${w.jp}。請按週日 16:00–17:30 的 90 分鐘流程逐題帶我複習單字、聽力、跟讀、文法、口說、閱讀及造句。`}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製指令')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function fallbackCopy(txt){let t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('已複製指令')}
function startQuiz(lang){quizSession={lang,questions:quizzes.filter(x=>x.lang===lang),idx:0,answers:[]};renderQuiz()}
function renderQuiz(){let target=document.getElementById('quiz-area');if(!target||!quizSession)return;let s=quizSession;if(s.idx>=s.questions.length){let score=s.answers.filter((v,i)=>v===s.questions[i].a).length;target.innerHTML=`<div class="notice"><strong>完成測驗：${score}/${s.questions.length}</strong><div class="small">以下為示例題庫結果，並非每週家教成績。</div></div>${s.questions.map((q,i)=>`<div class="resource"><strong>${i+1}. ${esc(q.q)}</strong><div class="${s.answers[i]===q.a?'correct':'incorrect'}">你的答案：${esc(q.opts[s.answers[i]])} ／ 正確：${esc(q.opts[q.a])}</div><div class="small">${esc(q.why)}</div></div>`).join('')}<button class="btn secondary" id="quiz-restart">重新測驗</button>`;if(!s.recorded){state.scores.push({lang:s.lang,score,total:s.questions.length,date:new Date().toLocaleString('zh-TW')});save();s.recorded=true}return}let q=s.questions[s.idx];target.innerHTML=`<div class="small">${s.lang==='fr'?'法文':'日文'} · 第 ${s.idx+1}/${s.questions.length} 題</div><div class="question">${esc(q.q)}</div>${q.opts.map((o,i)=>`<button class="option" data-answer="${i}">${esc(o)}</button>`).join('')}<div class="small">每題只選一個答案，提交後繼續。</div>`}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-week],[data-goweek],[data-copy],[data-startquiz],[data-answer],#quiz-restart,#export-data,#import-data,#reset-data');if(!t)return;if(t.dataset.page){page=t.dataset.page;quizSession=null;render();return}if(t.dataset.week!==undefined||t.dataset.goweek!==undefined){state.chosenWeek=Number(t.dataset.week??t.dataset.goweek);save();if(t.dataset.goweek!==undefined)page='curriculum';render();return}if(t.dataset.copy){copyText(promptFor(t.dataset.copy));return}if(t.dataset.startquiz){startQuiz(t.dataset.startquiz);return}if(t.dataset.answer!==undefined&&quizSession){quizSession.answers.push(Number(t.dataset.answer));quizSession.idx++;renderQuiz();return}if(t.id==='quiz-restart'){startQuiz(quizSession.lang);return}if(t.id==='export-data'){let blob=new Blob([JSON.stringify({app:'mon-parcours-v1',savedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mon-parcours-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);return}if(t.id==='import-data'){document.getElementById('import-file').click();return}if(t.id==='reset-data'){if(confirm('確定要清除所有任務、筆記和測驗紀錄嗎？此操作無法復原。')){state=structuredClone(defaults);save();render()}return}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.task){state.done[t.dataset.task]=t.checked;save();render()}if(t.id==='import-file'&&t.files?.[0]){let reader=new FileReader();reader.onload=()=>{try{let raw=JSON.parse(reader.result);if(raw.app!=='mon-parcours-v1'||!raw.data||typeof raw.data!=='object')throw Error('檔案格式不符');if(!confirm('匯入將取代目前所有學習紀錄，確定繼續？'))return;state={...structuredClone(defaults),...raw.data,done:raw.data.done||{},notes:raw.data.notes||{},scores:raw.data.scores||[]};save();render();alert('匯入成功')}catch(err){alert('無法匯入：'+err.message)}};reader.readAsText(t.files[0]);t.value=''}});
document.addEventListener('input',e=>{if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save()}});
render();
</script></body></html>
